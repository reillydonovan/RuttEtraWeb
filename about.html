<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e0a" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Theme (Modern | Phosphor): ?theme= wins and is remembered; otherwise the synth's own choice.
      try {
        var q = new URLSearchParams(location.search).get('theme');
        if (q === 'modern' || q === 'phosphor') localStorage.setItem('rw-ui-theme', q);
        if (localStorage.getItem('rw-ui-theme') === 'modern') document.documentElement.dataset.theme = 'modern';
      } catch (e) {}
    </script>
    <title>Rutt/Etra — Manual</title>
    <meta name="description" content="The Rutt/Etra browser video synthesizer manual. Long-form documentation for every control, modulation source, MIDI / OSC / CV connection, and recording workflow." />
    <meta property="og:title" content="Rutt/Etra — Manual" />
    <meta property="og:description" content="Long-form reference for the browser-based Rutt/Etra video synthesizer." />
    <meta property="og:type" content="article" />
  </head>
  <body class="about-body">
    <!-- Mobile-only: pinned corner button that opens the sidebar as an
         off-canvas drawer. Hidden on desktop, where the sidebar is
         always visible. -->
    <button id="about-toc-toggle" type="button" aria-label="Toggle table of contents" aria-expanded="false">☰ Contents</button>
    <!-- Mobile-only dim backdrop behind the open drawer; click to close. -->
    <div id="about-toc-backdrop"></div>

    <div id="about-shell">
      <!-- ======================================================
           Left sidebar: home link, search, and the table of
           contents. Persistent on desktop (position: sticky, its
           own scroll); an off-canvas drawer on mobile.
           ======================================================= -->
      <aside id="about-sidebar">
        <div id="about-sidebar-head">
          <a class="about-nav-home" href="./index.html" title="Back to the synth">← RUTT/ETRA</a>
          <input
            id="about-search"
            type="search"
            placeholder="search..."
            aria-label="Filter sections"
            autocomplete="off"
          />
        </div>
        <!-- Top-level links are hand-authored (one per markdown file);
             JS nests each section's own h3/h4 sub-headings under the
             matching link right after mount, so the TOC stays in sync
             with the manual's content without manual upkeep. -->
        <nav id="about-toc">
          <a href="#intro">Intro</a>
          <a href="#design-principles">Principles</a>
          <a href="#quick-start">Quick Start</a>
          <a href="#synthesis">Synthesis</a>
          <a href="#modulation">Modulation</a>
          <a href="#io">I/O</a>
          <a href="#performance">Performance</a>
          <a href="#reference">Reference</a>
          <a href="#tutorials">Tutorials</a>
          <a href="#about">About</a>
        </nav>
      </aside>
      <!-- The single long scrollable article. JS injects each
           markdown section into this container in fixed order. -->
      <main id="about-doc">
        <noscript>
          <div class="about-noscript">
            The manual is a single static document but its sections are
            assembled at page load. Enable JavaScript to read it, or use the
            source markdown files in <code>docs/about/</code>.
          </div>
        </noscript>
      </main>
    </div>
    <script type="module" src="/src/about/main.ts"></script>
  </body>
</html>

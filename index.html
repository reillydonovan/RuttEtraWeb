<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Belt-and-suspenders cache-bypass for the entry HTML.
         Hostinger LiteSpeed sends Cache-Control: max-age=604800 by
         default, which would otherwise pin returning visitors to a
         stale index.html (and the old hashed asset URLs it references)
         for up to 7 days. The .htaccess in dist/ also sets these
         server-side; these meta tags are the client-side fallback for
         the case where mod_headers isn't honored. Hashed assets in
         /assets/ stay long-cached as normal. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e0a" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RUTT/ETRA" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>RUTT/ETRA - Web Video Synthesizer</title>
    <!-- Startup splash (v1.31.3, owner ask): inline so it paints before any
         JS/CSS loads; main.ts fades it out after the first rendered frame
         (hideSplash). Uses system mono — web fonts aren't loaded yet. -->
    <style>
      #rw-splash {
        position: fixed; inset: 0; z-index: 100000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #0a0e0a; color: #7eff9c;
        font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.18em; text-transform: uppercase;
        transition: opacity 0.35s ease;
      }
      #rw-splash.rw-splash-out { opacity: 0; pointer-events: none; }
      #rw-splash .rw-splash-title { font-size: 26px; letter-spacing: 0.3em; text-shadow: 0 0 10px rgba(95,255,133,0.6); }
      #rw-splash .rw-splash-sub { color: #5a9a72; font-size: 11px; }
      #rw-splash .rw-splash-bar { width: 220px; height: 2px; background: rgba(95,255,133,0.15); overflow: hidden; }
      #rw-splash .rw-splash-bar::after {
        content: ''; display: block; width: 35%; height: 100%;
        background: #7eff9c; box-shadow: 0 0 8px #7eff9c;
        animation: rw-splash-scan 1.1s ease-in-out infinite;
      }
      @keyframes rw-splash-scan { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
      @media (prefers-reduced-motion: reduce) { #rw-splash .rw-splash-bar::after { animation: none; width: 100%; opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="rw-splash" role="status" aria-live="polite">
      <div class="rw-splash-title">RUTT/ETRA</div>
      <div class="rw-splash-bar"></div>
      <div class="rw-splash-sub" id="rw-splash-sub">warming up the scan processor…</div>
    </div>
    <script>
      // If startup never finishes (a load error before main.ts runs), say so
      // instead of leaving the splash up forever.
      setTimeout(function () {
        var sub = document.getElementById('rw-splash-sub');
        if (sub && document.getElementById('rw-splash')) {
          sub.textContent = 'taking longer than usual — try reloading, or add ?reset to the address';
        }
      }, 20000);
    </script>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="overlay">
        <div id="boot-message">
          <!-- The version span is populated at boot from __BUILD_INFO__
               (package.json version + git commit + build date) so the
               overlay can never show a stale hardcoded number. -->
          <div class="boot-line">RUTT/ETRA WEB SYNTHESIZER <span id="boot-version"></span></div>
          <div class="boot-line dim">select a source to begin</div>
          <div id="boot-sources">
            <button class="boot-src" id="boot-webcam">WEBCAM</button>
            <button class="boot-src" id="boot-screen">SCREEN</button>
            <button class="boot-src" id="boot-file">FILE</button>
            <button class="boot-src" id="boot-stream-btn">STREAM URL</button>
            <button class="boot-src" id="boot-pattern">PATTERN</button>
          </div>
          <div id="boot-stream-row">
            <input id="boot-stream-input" type="url" placeholder="https://…/stream.m3u8" />
            <button id="boot-stream-connect">CONNECT</button>
          </div>
          <input id="boot-file-input" type="file" accept="video/*" style="display:none" />
          <div class="boot-error" id="boot-error"></div>
          <button id="boot-skip">continue without video →</button>
        </div>
      </div>
      <!-- Center workspace region shell — positioned by main.ts resize()
           to the exact rect the render canvas occupies. Hosts the
           RENDERER view (click-through) or any other view (overlay). -->
      <div id="rw-center-shell" class="rw-zoomchrome"></div>
      <!-- Left workspace window — hidden while it holds no tabs. -->
      <aside id="rw-left-shell" class="rw-zoomchrome"></aside>
      <aside id="panel-root" class="rw-zoomchrome"></aside>
      <div id="hud" class="rw-zoomchrome"></div>
      <!-- The manual link lives in the menu bar (Help → Open Manual);
           the old always-visible #about-link corner anchor was absorbed
           there when the app menu bar shipped. -->
      <div id="timeline-dock" class="rw-zoomchrome" data-dock="hidden"></div>
      <video id="src-video" autoplay muted playsinline style="display:none"></video>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

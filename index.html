<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Belt-and-suspenders cache-bypass for the entry HTML.
         Hostinger LiteSpeed sends Cache-Control: max-age=604800 by
         default, which would otherwise pin returning visitors to a
         stale index.html (and the old hashed asset URLs it references)
         for up to 7 days. The .htaccess in dist/ also sets these
         server-side; these meta tags are the client-side fallback for
         the case where mod_headers isn't honored. Hashed assets in
         /assets/ stay long-cached as normal. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e0a" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RUTT/ETRA" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>RUTT/ETRA - Web Video Synthesizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="overlay">
        <div id="boot-message">
          <div class="boot-line">RUTT/ETRA WEB SYNTHESIZER v0.1</div>
          <div class="boot-line dim">awaiting video source...</div>
          <button id="start-btn">REQUEST WEBCAM</button>
        </div>
      </div>
      <aside id="panel-root"></aside>
      <div id="hud"></div>
      <!-- Long-form manual at about.html — separate page, separate
           bundle, no synth state shared. Plain anchor so it works
           without any JS, including in the no-script fallback. -->
      <a id="about-link" href="./about.html" title="Open the manual">ABOUT</a>
      <div id="timeline-dock" data-dock="hidden"></div>
      <video id="src-video" autoplay muted playsinline style="display:none"></video>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

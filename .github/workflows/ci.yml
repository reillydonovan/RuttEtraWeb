name: CI

# Checks pull requests and every branch except main (main runs the same
# checks inside deploy.yml before it uploads). No secrets are used here,
# so it is safe to run on pull requests from forks.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/check-about-bundle.cjs
